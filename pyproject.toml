[project]
name = "SportsAppService"
version = "0.1.0"
description = "SportsApp FastAPI service for CRUD operations with PostgreSQL"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.110",
    "uvicorn>=0.29",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "SportsAppModels @ file:///code/SportsAppModels"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"