[project]
name = "sportsappmodels"
version = "0.1.0"
description = "Shared SQLModel domain models and Pydantic schemas for SportsApp"
requires-python = ">=3.10"
dependencies = [
    "sqlmodel>=0.0.16",
    "pydantic>=2.6",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"